<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#dfeaf1}#s{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><div id="s"></div>
<script type="module">
// Development page for the sculpted head (avatar/head.js): one head, weights and camera from the address.
//   ?w=jawOpen:0.4,mouthSmile_L:1&look=10,-5&cam=25,5,62&shape=eye:1.5,skull:1.2&d=skin:f1c7a5&grid=3
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/addons/RoomEnvironment.js';
import { loadHeadBase, Head, Field } from './avatar/head.js';
import { occluded } from './avatar/bake.js';
const q = new URLSearchParams(location.search);
const kv = (s, num = true) => Object.fromEntries((s || '').split(',').filter(Boolean).map((p) => { const [k, v] = p.split(':'); return [k, num ? +v : v]; }));
const el = document.getElementById('s');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(+(q.get('dpr') || 1)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = q.get('shadow') !== '0'; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
el.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') ? '#' + q.get('bg') : '#dfeaf1');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#ffffff', '#c9b8a8', +(q.get('hemi') || 0.55))); scene.environmentIntensity = 1;
const key = new THREE.DirectionalLight('#fff1e0', +(q.get('key') || 1.7)); key.position.set(25, 40, 50); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 200 }); key.shadow.bias = -0.002; key.shadow.normalBias = 0.05;
scene.add(key);
const rim = new THREE.DirectionalLight('#cfe4ff', 1.1); rim.position.set(-40, 30, -40); scene.add(rim);
const fill = new THREE.DirectionalLight('#ffe9f0', 0.4); fill.position.set(-30, 10, 30); scene.add(fill);
const camera = new THREE.PerspectiveCamera(28, 1, 1, 1000);
await loadHeadBase();
const design = { ...kv(q.get("d"), false), shape: kv(q.get("shape")), hide: (q.get("hide") || "").split(","), pose: kv(q.get("pose")) };
for (const k of ['skin', 'lip', 'lid', 'iris', 'hair', 'lash', 'blush', 'shade']) if (design[k]) design[k] = '#' + design[k];
for (const k of ['lipRings', 'lipAmount', 'irisSize', 'pupilSize', 'blushAmount']) if (design[k] !== undefined) design[k] = +design[k];
if (q.get('lash')) design.lash = kv(q.get('lash'));
if (q.get('brow')) { const b = kv(q.get('brow')); design.brow = { in: [b.ix ?? 1.25, b.iy ?? 5.0], top: [b.tx ?? 4.0, b.ty ?? 5.8], out: [b.ox ?? 5.9, b.oy ?? 5.05], thick: [b.t0 ?? 0.55, b.t1 ?? 0.5, b.t2 ?? 0.12], lift: b.lift ?? 0.13 }; }
const t0 = performance.now();
const head = new Head(design); window.head = head; scene.add(head.root);
const tBuild = performance.now() - t0;
if (q.get('hair')) { // test hair: short, with a fringe swept to one side
  const f = new Field(), hm = occluded(new THREE.MeshPhysicalMaterial({ color: design.hair || '#2a2220', roughness: 0.55, sheen: 1, sheenColor: new THREE.Color(design.hair || '#2a2220').lerp(new THREE.Color('#ffffff'), 0.5), sheenRoughness: 0.35, clearcoat: 0.3, clearcoatRoughness: 0.5 }));
  f.ell([0, 6.0, 0.4], [8.9, 10.3, 10.4]);
  f.half([0, 9.3, 9.6], [0, -1, 0.865], { mode: 'keep', k: 1.0 });
  for (const s of [-1, 1]) f.ell([s * 8.6, 1.3, 1.2], [2.4, 3.6, 2.8], { mode: 'cut', k: 0.6 });
  f.ell([-2.2, 10.4, 8.3], [4.6, 1.9, 2.6], { rot: [0.5, 0.2, 0.25], k: 0.5 });
  f.ell([3.0, 10.9, 7.9], [3.6, 1.7, 2.6], { rot: [0.5, -0.2, -0.3], k: 0.5 });
  const hm2 = head.addSculpt(f, hm, +(q.get('cell') || 0.4)); console.log('hair', hm2.geometry.attributes.position.count, 'vertices', hm2.userData.buildMs.toFixed(0), 'ms');
}
if (q.get('ao') !== '0') { const tb = performance.now(); head.bake(renderer); console.log('bake', (performance.now() - tb).toFixed(0), 'ms'); }
const weights = kv(q.get('w')); head.set(weights);
const [ly, lp] = (q.get('look') || '0,0').split(',').map(Number); head.look(ly, lp);
const t1 = performance.now(); head.update(true); const tUp = performance.now() - t1;
const [cy, cp, cd, ch] = (q.get('cam') || '0,0,62,1').split(',').map(Number);
function draw() {
  const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h, false); renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const a = (cy * Math.PI) / 180, b = (cp * Math.PI) / 180, c = new THREE.Vector3(0, ch ?? 1, 2);
  camera.position.set(c.x + cd * Math.sin(a) * Math.cos(b), c.y + cd * Math.sin(b), c.z + cd * Math.cos(a) * Math.cos(b)); camera.lookAt(c);
  renderer.render(scene, camera);
}
draw();
console.log(`build ${tBuild.toFixed(0)} ms, update ${tUp.toFixed(1)} ms, vertices ${head.base.n}`);
window.setW = (w, look) => { head.set(w); if (look) head.look(look[0], look[1]); head.update(); draw(); };
window.READY = true;
</script></body></html>
