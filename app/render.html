<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}#s{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><div id="s"></div>
<script type="module">
// Offline renderer used by render.mjs: plays rig-space emo tracks (T*K floats per avatar) frame by frame.
import { Stage } from './ui/stage.js';
import { K, IDS } from './core/au.js';
const stage = new Stage(document.getElementById("s"), { preserve: true, shadows: false }); window.__stage = stage;
let tracks = [];
window.setup = (avatars, view) => { stage._sig = null; stage.setCharacters(avatars); stage.setView(view || null); };
window.setTracks = (t) => { tracks = t.map((a) => Float32Array.from(a)); };
// advance the simulation over frames [a, b) without drawing them
window.stepFrames = (a, b) => { for (let i = a; i < b; i++) tracks.forEach((tr, j) => { const T = tr.length / K, t = Math.min(T - 1, i), o = {}; for (let k = 0; k < K; k++) o[IDS[k]] = tr[t * K + k]; stage.apply(j, o, 1 / 30); }); };
window.renderFrame = (i, quality = 0.92) => {
  tracks.forEach((tr, j) => {
    const T = tr.length / K, t = Math.min(T - 1, i), o = {};
    for (let k = 0; k < K; k++) o[IDS[k]] = tr[t * K + k];
    stage.apply(j, o, 1 / 30);
  });
  stage.render();
  return stage.canvas.toDataURL('image/jpeg', quality);
};
window.READY = true;
</script></body></html>
