<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}#s{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><div id="s"></div>
<script type="module">
import { Stage } from './ui/stage.js';
import { Composer } from './core/project.js';
import { DESIGNS } from './avatar/characters.js';
import { K } from './core/au.js';
const meta = (await fetch('models/emo_offline.json').then(r => r.json())).meta;
const composer = new Composer(meta, DESIGNS);
const stage = new Stage(document.getElementById('s'), { preserve: true });
window.setup = (avatars) => { stage.setCharacters(avatars); };
// tracks: array of Float32 arrays (flattened T*K), raw=true -> skip style exaggeration
window.renderFrame = (tracks, i, opts = {}) => {
  tracks.forEach((tr, j) => {
    const T = tr.length / K, t = Math.min(T - 1, i);
    const f = Float32Array.from(tr.slice(t * K, t * K + K));
    stage.apply(j, opts.raw ? Object.fromEntries(meta.names.map((n, k) => [n, f[k]])) : composer.styled(f, stage.chars[j].d.name.toLowerCase()));
  });
  stage.render();
  return stage.canvas.toDataURL('image/jpeg', 0.92);
};
window.READY = true;
</script></body></html>
