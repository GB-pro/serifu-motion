<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#dfeaf1;overflow:hidden}canvas{display:block;position:absolute;left:0;top:0}#ov{pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<canvas id="ov"></canvas>
<script type="module">
// Development harness: renders a grid of poses (model sheet) or sampled frames of a track (film strip) for visual review.
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/addons/RoomEnvironment.js';
import { createCharacter } from './avatar/characters.js';
import { IDS, K } from './core/au.js';
const r = new THREE.WebGLRenderer({ antialias: true, stencil: true, preserveDrawingBuffer: true });
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.autoClear = false;
document.body.insertBefore(r.domElement, document.getElementById('ov'));
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#ffffff', '#c9b8a8', 0.55));
const key = new THREE.DirectionalLight('#fff1e0', 1.7); key.position.set(2.5, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight('#cfe4ff', 1.1); rim.position.set(-4, 3, -4); scene.add(rim);
const fill = new THREE.DirectionalLight('#ffe9f0', 0.4); fill.position.set(-3, 1, 3); scene.add(fill);
const chars = {};
function getChar(k) { if (!chars[k]) { chars[k] = createCharacter(k); scene.add(chars[k].root); } for (const j in chars) chars[j].root.visible = j === k; return chars[k]; }
function cam(cw, ch, view) {
  const c = new THREE.PerspectiveCamera(view.fov || 20, cw / ch, 0.1, 100);
  c.position.set(view.x || 0, view.y ?? 1.0, view.z || 9.2); c.lookAt(view.lx || 0, view.ly ?? 0.82, 0); return c;
}
function layout(n, cols, cw, ch) {
  const rows = Math.ceil(n / cols), W = cols * cw, H = rows * ch;
  r.setPixelRatio(1); r.setSize(W, H);
  const ov = document.getElementById('ov'); ov.width = W; ov.height = H;
  r.setScissorTest(false); r.setClearColor('#dfeaf1'); r.clear();
  return { rows, W, H, g: ov.getContext('2d') };
}
function cell(i, cols, cw, ch, L, camera, bg) {
  const cx = (i % cols) * cw, cyTop = Math.floor(i / cols) * ch;
  r.setViewport(cx, L.H - cyTop - ch, cw, ch); r.setScissor(cx, L.H - cyTop - ch, cw, ch); r.setScissorTest(true);
  r.setClearColor(bg || (((i % cols) + Math.floor(i / cols)) % 2 ? '#d5e3ec' : '#dfeaf1')); r.clear();
  r.render(scene, camera);
  return [cx, cyTop];
}
// cells: [{pose:{id:value}, label}]
window.sheet = (charKey, cells, cols = 4, cw = 360, ch = 400, view = {}) => {
  const c = getChar(charKey), L = layout(cells.length, cols, cw, ch), camera = cam(cw, ch, view);
  cells.forEach((ce, i) => {
    c.apply(ce.pose || {}, 0);
    const [x, y] = cell(i, cols, cw, ch, L, camera);
    L.g.font = '600 15px system-ui, sans-serif'; L.g.fillStyle = '#1d2b36'; L.g.fillText(ce.label || '', x + 10, y + 22);
  });
  return [L.W, L.H];
};
// track: flat array T*K (final channels, straight into the rig); idx: frames to show (all frames are simulated for follow-through)
window.strip = (charKey, track, idx, cols = 8, cw = 240, ch = 270, view = {}, labels = null) => {
  const c = getChar(charKey), L = layout(idx.length, cols, cw, ch), camera = cam(cw, ch, view);
  const T = track.length / K, want = new Map(idx.map((f, i) => [f, i]));
  c.apply({}, 0);
  for (let t = Math.max(0, Math.min(...idx) - 45); t < T && t <= Math.max(...idx); t++) {
    const o = {}; for (let k = 0; k < K; k++) o[IDS[k]] = track[t * K + k];
    c.apply(o, 1 / 30);
    if (want.has(t)) {
      const i = want.get(t), [x, y] = cell(i, cols, cw, ch, L, camera);
      L.g.font = '600 13px system-ui, sans-serif'; L.g.fillStyle = '#1d2b36'; L.g.fillText(labels ? labels[i] : ('f' + t + '  ' + (t / 30).toFixed(2) + 's'), x + 8, y + 18);
    }
  }
  return [L.W, L.H];
};
window.READY = true;
</script></body></html>
