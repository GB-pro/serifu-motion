<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#dfeaf1}#s{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><div id="s"></div>
<script type="module">
// Development page for a whole character (avatar/figure.js, avatar/cast.js) under the light of the stage.
//   ?c=hana&a=AU12:0.8,headYaw:10&cam=yaw,pitch,dist,targetY&shape=eye:1.5&d=skin:f1c7a5&body=shoulder:8&ao=0
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/addons/RoomEnvironment.js';
import { DESIGNS, loadCast } from './avatar/cast.js';
import { Figure } from './avatar/figure.js';
const q = new URLSearchParams(location.search);
const kv = (s, num = true) => Object.fromEntries((s || '').split(',').filter(Boolean).map((p) => { const [k, v] = p.split(':'); return [k, num ? +v : v]; }));
const el = document.getElementById('s');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(+(q.get('dpr') || 1)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = q.get('shadow') !== '0'; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
el.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') ? '#' + q.get('bg') : '#dfeaf1');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#ffffff', '#c9b8a8', +(q.get('hemi') || 0.55)));
const key = new THREE.DirectionalLight('#fff1e0', +(q.get('key') || 1.7)); key.position.set(2.5, 4, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -3, right: 3, top: 4, bottom: -2, near: 0.5, far: 20 }); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.01;
scene.add(key);
const rim = new THREE.DirectionalLight('#cfe4ff', 1.1); rim.position.set(-4, 3, -4); scene.add(rim);
const fill = new THREE.DirectionalLight('#ffe9f0', 0.4); fill.position.set(-3, 1, 3); scene.add(fill);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
await loadCast();
const base = DESIGNS[q.get('c') || 'hana'], design = { ...base, head: { ...base.head, ...kv(q.get('d'), false), shape: { ...base.head.shape, ...kv(q.get('shape')) } }, body: { ...base.body, ...kv(q.get('body')) } };
for (const k of ['skin', 'lip', 'lid', 'iris', 'hair', 'blush', 'shade']) if (typeof design.head[k] === 'string' && !design.head[k].startsWith('#')) design.head[k] = '#' + design.head[k];
for (const k of ['lipRings', 'lipAmount', 'irisSize', 'pupilSize', 'blushAmount']) if (design.head[k] !== undefined) design.head[k] = +design.head[k];
if (q.get('nohair')) design.hair = null;
if (q.get('nowear')) design.wear = null;
const t0 = performance.now();
const fig = new Figure(design); window.fig = fig; scene.add(fig.root);
const tBuild = performance.now() - t0;
if (q.get('showform')) { // the smooth form of the head next to the character
  const { polygonise } = await import('./avatar/sculpt.js'), m = polygonise(design.head.shape.form, 0.4, [[-12, -12, -12], [12, 17, 14]]), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(m.nrm, 3)); g.setIndex(new THREE.BufferAttribute(m.idx, 1));
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: '#c9d2e0', roughness: 0.6 })); mesh.position.x = +(q.get('showform')) || 0; fig.gSkull.add(mesh);
}
if (q.get('mat')) { // looking at the surface itself: mat=normal (the direction of the skin as colour), mat=clay, mat=wire
  const m = q.get('mat'), mm = m === 'normal' ? new THREE.MeshNormalMaterial() : m === 'wire' ? new THREE.MeshBasicMaterial({ color: '#223', wireframe: true }) : new THREE.MeshStandardMaterial({ color: '#b9b9b9', roughness: 0.55 });
  fig.head.mesh.material = fig.head.mesh.material.map((x, i) => (i < 2 ? mm : x));
}
if (q.get('ao') !== '0') { const tb = performance.now(); fig.bake(renderer); console.log('bake', (performance.now() - tb).toFixed(0), 'ms'); }
const [cy, cp, cd, ch, cx = 0] = (q.get('cam') || '0,2,7.6,0.85').split(',').map(Number);
function draw() {
  const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h, false); renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const a = (cy * Math.PI) / 180, b = (cp * Math.PI) / 180, c = new THREE.Vector3(cx, ch ?? 0.85, 0);
  camera.position.set(c.x + cd * Math.sin(a) * Math.cos(b), c.y + cd * Math.sin(b), c.z + cd * Math.cos(a) * Math.cos(b)); camera.lookAt(c);
  renderer.render(scene, camera);
}
const t1 = performance.now(); fig.apply(kv(q.get('a'))); const tUp = performance.now() - t1;
draw();
console.log(`build ${tBuild.toFixed(0)} ms, apply ${tUp.toFixed(1)} ms`);
window.setW = (a) => { fig.apply(a); draw(); };
window.READY = true;
</script></body></html>
